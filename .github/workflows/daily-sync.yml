name: daily-sync

on:
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_TOKEN }}

      - name: Update log
        run: |
          set -euo pipefail
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

          git fetch origin main
          git checkout -B main origin/main

          sleep $(( RANDOM % 600 ))

          N=$(( RANDOM % 8 + 8 ))
          echo "Making $N commits today"

          touch ACTIVITY.md
          for i in $(seq 1 "$N"); do
            echo "- $(date -u '+%Y-%m-%d %H:%M:%S UTC') log entry $RANDOM" >> ACTIVITY.md
            git add ACTIVITY.md
            git commit -m "docs: update log $i/$N"
            sleep 2
          done

          git push origin HEAD:main